pluginManagement {
  plugins {
    id "biz.aQute.bnd.builder" version "7.4.0"
  }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'nifty-sunspec'

include('api')
include('core')
include('modbus-nifty')
include('shell')
include('test')

project(':api').name = 'nifty-sunspec-api'
project(':core').name = 'nifty-sunspec-core'
project(':modbus-nifty').name = 'nifty-sunspec-modbus-nifty'
project(':shell').name = 'nifty-sunspec-shell'
project(':test').name = 'nifty-sunspec-test'
